version: '3.8'

services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: bank_recon
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:mysql://db:3306/bank_recon
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
    depends_on:
      - db

volumes:
  mysql_data:
