version: '3.8'

services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: bank_recon
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=mysql://admin:password@db:3306/bank_recon
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A bank_recon worker -l info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=mysql://admin:password@db:3306/bank_recon
    depends_on:
      - db
      - redis
      - web

volumes:
  mysql_data:
