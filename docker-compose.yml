version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bank_recon
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://admin:password@db:5432/bank_recon
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A bank_recon worker -l info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://admin:password@db:5432/bank_recon
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
